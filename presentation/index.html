<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Топливный космоконтур — презентация</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a2029; --panel2: #232b36; --border: #2f3846;
    --text: #d8dee9; --muted: #8a94a6; --accent: #4a9eff; --ok: #3fb950;
    --warn: #d29922; --err: #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 800px at 70% -10%, #1a2740 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }

  /* сцена слайда */
  .stage {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 6vh 8vw; position: relative;
  }
  .slide {
    width: 100%; max-width: 1000px; animation: fade .35s ease;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .slide h1 { font-size: clamp(32px, 6vw, 64px); line-height: 1.1; letter-spacing: -0.5px; }
  .slide h2 {
    font-size: clamp(24px, 4vw, 40px); margin-bottom: 22px;
    padding-bottom: 14px; border-bottom: 2px solid var(--border);
  }
  .slide-title { text-align: center; }
  .slide-title h1 {
    background: linear-gradient(120deg, #eaf1ff, #4a9eff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .slide-subtitle { font-size: clamp(16px, 2.4vw, 26px); color: var(--text); margin-top: 22px; }
  .slide-note { font-size: clamp(13px, 1.6vw, 18px); color: var(--muted); margin-top: 18px; }

  .slide-lead { font-size: clamp(16px, 2.2vw, 24px); color: #eaf1ff; margin-bottom: 22px; line-height: 1.4; }
  .slide-bullets { list-style: none; }
  .slide-bullets li {
    font-size: clamp(15px, 1.9vw, 21px); line-height: 1.5; padding: 10px 0 10px 34px;
    position: relative; color: var(--text);
  }
  .slide-bullets li::before {
    content: ''; position: absolute; left: 6px; top: 20px;
    width: 9px; height: 9px; border-radius: 2px; background: var(--accent); transform: rotate(45deg);
  }
  .slide-foot {
    margin-top: 26px; padding: 14px 18px; background: var(--panel);
    border-left: 4px solid var(--accent); border-radius: 6px;
    font-size: clamp(14px, 1.7vw, 19px); color: var(--muted);
  }

  /* метрики */
  .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-top: 10px; }
  .metric {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 26px 24px;
  }
  .metric-value {
    font-size: clamp(30px, 5vw, 52px); font-weight: 700; color: var(--accent); line-height: 1;
  }
  .metric-label { color: var(--muted); font-size: clamp(13px, 1.6vw, 18px); margin-top: 12px; }

  /* таблица */
  .slide-table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: clamp(14px, 1.9vw, 21px); }
  .slide-table th, .slide-table td { border: 1px solid var(--border); padding: 12px 16px; text-align: right; }
  .slide-table th { background: var(--panel2); text-align: center; }
  .slide-table td.txt, .slide-table th.txt { text-align: left; }

  /* нижняя панель управления */
  .controls {
    display: flex; align-items: center; gap: 16px; padding: 14px 24px;
    background: rgba(26,32,41,0.85); border-top: 1px solid var(--border); backdrop-filter: blur(6px);
  }
  .btn {
    background: var(--accent); color: #fff; border: none; padding: 9px 16px;
    border-radius: 6px; cursor: pointer; font-size: 14px;
  }
  .btn:hover { opacity: .9; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.secondary { background: var(--panel2); border: 1px solid var(--border); color: var(--text); }
  .dots { display: flex; gap: 8px; flex: 1; justify-content: center; flex-wrap: wrap; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--border); cursor: pointer; transition: .2s; }
  .dot:hover { background: var(--muted); }
  .dot.active { background: var(--accent); transform: scale(1.25); }
  .counter { color: var(--muted); font-size: 14px; min-width: 56px; text-align: center; }
  .brand { color: var(--muted); font-size: 14px; font-weight: 600; }

  /* прогресс сверху */
  .progress { height: 3px; background: var(--accent); width: 0; transition: width .3s ease; }
</style>
</head>
<body>
  <div class="progress" id="progress"></div>
  <div class="stage"><div id="slide"></div></div>
  <div class="controls">
    <span class="brand">Топливный космоконтур</span>
    <button class="btn secondary" id="prev">← Назад</button>
    <div class="dots" id="dots"></div>
    <button class="btn secondary" id="next">Вперёд →</button>
    <span class="counter" id="counter"></span>
    <button class="btn" id="fs">На весь экран</button>
  </div>

<script>
const SLIDES = [
  { kind:'title', title:'Топливный космоконтур',
    subtitle:'Система планирования снабжения орбитального топливного узла',
    note:'Горизонт 2035–2040 · расчётное ядро + веб-интерфейс оператора' },

  { kind:'content', title:'Проблема',
    lead:'Орбитальный узел нужно надёжно и экономично снабжать топливом — а условия быстро усложняются.',
    bullets:[
      'Спрос растёт почти в 4 раза: 100 → 390 т/год (в стрессе до 448).',
      'Пять каналов снабжения с разной ценой, надёжностью, сроками и обязательствами.',
      'Жёсткие рамки: сервис ≥ 99% критического и ≥ 97% общего спроса, лимиты вложений, 45-дневный резерв.',
      'Крупные необратимые решения: лунная добыча, модернизация склада.'],
    foot:'Планировать это в таблицах вручную — медленно и ненадёжно.' },

  { kind:'content', title:'Решение',
    lead:'Цифровой контур: живое расчётное ядро + рабочее место оператора.',
    bullets:[
      'Оператор задаёт план — система мгновенно считает баланс, экономику, сервис и нарушения.',
      'Два сценария (стандартный и стрессовый) на одной базе, сравнение в один клик.',
      'Инструменты поверх ядра: оптимизатор, анализ чувствительности, риски по Монте-Карло.',
      'Импорт своих данных из CSV/XLSX без строгой структуры.'],
    foot:'Одни и те же числа в интерфейсе, командной строке и выгрузке.' },

  { kind:'content', title:'Как работает ядро',
    lead:'Конвейер из 7 стадий, помесячный шаг по физике, годовой — по контрактам.',
    bullets:[
      'Доступность → баланс → сервис → экономика → ограничения → риски → сценарии.',
      'Баланс: запас_конец = запас_начало + поступление − потери − выдача.',
      'Платёж: цена × max(отбор, take-or-pay × резерв).',
      'Потери и обязательства — один раз; резерв ≠ запас; надёжность — отдельный риск.'] },

  { kind:'content', title:'Рабочее место оператора',
    lead:'Семь экранов под реальный рабочий процесс.',
    bullets:[
      'Данные — спрос, каналы, склад, инвестиции, ограничения.',
      'Импорт — загрузка своих данных (CSV или один XLSX на все таблицы).',
      'Решения — план по каналам и годам, живой индикатор покрытия спроса.',
      'Дашборд — KPI, графики, баланс по годам.',
      'Проверки, Сравнение сценариев, Геополитика.'] },

  { kind:'metrics', title:'Рекомендуемая стратегия',
    lead:'Диверсифицированный портфель с поэтапным вводом лунной добычи и ZBO-складом.',
    metrics:[
      { value:'100%', label:'сервис в стандартном сценарии' },
      { value:'0', label:'нарушений ограничений' },
      { value:'12 030', label:'суммарные расходы, млн у.е.' },
      { value:'1 790', label:'CAPEX, млн у.е. (лимит 1 800)' }],
    foot:'Критический спрос обслуживается на 100% даже в стрессе.' },

  { kind:'table', title:'Стресс-тест',
    lead:'С 2038 спрос ×1,15, лунная добыча по факту. Картина честная.',
    columns:['Год','Спрос','Общий сервис','Критич. сервис'],
    rows:[['2035–2038','100–288','100%','100%'],
          ['2039','368','97,2%','100%'],
          ['2040','448','93,0%','100%']],
    foot:'Критический спрос закрыт полностью. Просадку общего сервиса показываем, а не прячем.' },

  { kind:'content', title:'Оптимизация',
    lead:'MILP-оптимизатор отвечает на вопрос «а это лучший план?».',
    bullets:[
      'Минимизирует дисконтированные расходы при всех ограничениях (PuLP + CBC).',
      'Оптимизатор предлагает — ядро проверяет; итоговая цена всегда из ядра.',
      'Зазор до оптимума ≤ 4,5% в стандартном сценарии.',
      'Вывод: самый дешёвый план в стрессе проваливает сервис до 79,7% — берём устойчивый.'] },

  { kind:'metrics', title:'Риски и чувствительность',
    lead:'Количественная оценка, а не общие слова.',
    metrics:[
      { value:'±2 495', label:'влияние цены Earth-Core, млн у.е. (±20%)' },
      { value:'90,5%', label:'критич. спрос закрыт (Монте-Карло)' },
      { value:'168 т', label:'дефицит в худших 5% случаев (VaR)' },
      { value:'3000', label:'прогонов, детерминизм по seed' }] },

  { kind:'content', title:'Гибкий импорт данных',
    lead:'Загрузите свои данные — система сама разберётся в структуре.',
    bullets:[
      'CSV или XLSX, любые названия и порядок колонок, RU/EN заголовки.',
      'Один многолистовой XLSX меняет все данные сразу.',
      'Автораспознавание колонок + ручная правка сопоставления.',
      'Работа на копии: исходные данные всегда можно вернуть.'] },

  { kind:'metrics', title:'Надёжность и проверяемость',
    lead:'Результатам можно доверять.',
    metrics:[
      { value:'74', label:'автотеста' },
      { value:'10/10', label:'контрольные примеры V01–V10' },
      { value:'1 источник', label:'истины: веб = консоль = выгрузка' },
      { value:'1 команда', label:'docker compose up' }] },

  { kind:'title', title:'Готовый инструмент решений по снабжению',
    subtitle:'Строит и проверяет планы, находит оптимум, оценивает риски',
    note:'100% критического сервиса во всех сценариях при контролируемых затратах' },
];

let idx = 0;
const slideEl = document.getElementById('slide');
const dotsEl = document.getElementById('dots');
const counterEl = document.getElementById('counter');
const progressEl = document.getElementById('progress');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const fsBtn = document.getElementById('fs');

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderSlide(s){
  if (s.kind === 'title')
    return `<div class="slide slide-title">
      <h1>${esc(s.title)}</h1>
      ${s.subtitle?`<div class="slide-subtitle">${esc(s.subtitle)}</div>`:''}
      ${s.note?`<div class="slide-note">${esc(s.note)}</div>`:''}
    </div>`;
  if (s.kind === 'metrics')
    return `<div class="slide">
      <h2>${esc(s.title)}</h2>
      ${s.lead?`<div class="slide-lead">${esc(s.lead)}</div>`:''}
      <div class="metrics">${s.metrics.map(m=>
        `<div class="metric"><div class="metric-value">${esc(m.value)}</div>
         <div class="metric-label">${esc(m.label)}</div></div>`).join('')}</div>
      ${s.foot?`<div class="slide-foot">${esc(s.foot)}</div>`:''}
    </div>`;
  if (s.kind === 'table')
    return `<div class="slide">
      <h2>${esc(s.title)}</h2>
      ${s.lead?`<div class="slide-lead">${esc(s.lead)}</div>`:''}
      <table class="slide-table">
        <thead><tr>${s.columns.map((c,i)=>`<th class="${i===0?'txt':''}">${esc(c)}</th>`).join('')}</tr></thead>
        <tbody>${s.rows.map(r=>`<tr>${r.map((c,j)=>`<td class="${j===0?'txt':''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>
      ${s.foot?`<div class="slide-foot">${esc(s.foot)}</div>`:''}
    </div>`;
  // content
  return `<div class="slide">
    <h2>${esc(s.title)}</h2>
    ${s.lead?`<div class="slide-lead">${esc(s.lead)}</div>`:''}
    <ul class="slide-bullets">${s.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>
    ${s.foot?`<div class="slide-foot">${esc(s.foot)}</div>`:''}
  </div>`;
}

function render(){
  slideEl.innerHTML = renderSlide(SLIDES[idx]);
  counterEl.textContent = (idx+1) + ' / ' + SLIDES.length;
  progressEl.style.width = ((idx+1)/SLIDES.length*100) + '%';
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === SLIDES.length - 1;
  [...dotsEl.children].forEach((d,i)=>d.classList.toggle('active', i===idx));
}

function go(i){ idx = Math.max(0, Math.min(SLIDES.length-1, i)); render(); }

// точки
SLIDES.forEach((_,i)=>{
  const d = document.createElement('span');
  d.className = 'dot'; d.title = 'Слайд ' + (i+1);
  d.onclick = ()=>go(i);
  dotsEl.appendChild(d);
});

prevBtn.onclick = ()=>go(idx-1);
nextBtn.onclick = ()=>go(idx+1);
fsBtn.onclick = ()=>{
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
};
document.addEventListener('fullscreenchange', ()=>{
  fsBtn.textContent = document.fullscreenElement ? 'Выйти' : 'На весь экран';
});

document.addEventListener('keydown', e=>{
  if (['ArrowRight','PageDown',' '].includes(e.key)) { go(idx+1); e.preventDefault(); }
  else if (['ArrowLeft','PageUp'].includes(e.key)) { go(idx-1); e.preventDefault(); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(SLIDES.length-1);
  else if (e.key === 'f') fsBtn.click();
});

render();
</script>
</body>
</html>
