# Обязательный стрессовый сценарий.
# Источник: Постановка, раздел "Стандартный и стрессовый сценарии" +
# "Правила контрольных расчётов" (с. 6-7).
#
# Изменения:
#   1) с 2038 общий И критический базовый спрос * 1.15 (до 2038 не меняется)
#   2) ISRU поставляет заданные ФАКТИЧЕСКИЕ доли (без повторного умножения
#      на коэффициент надёжности)
# Стресс НЕ объединяется автоматически с высоким спросом.
id: stress
name: Обязательный стрессовый сценарий
description: >
  С 2038 спрос x1.15. ISRU по фактическим долям поставки.
  Уровни 99%/97% показываются как ориентиры устойчивости, не обязательны.

demand_variant: base
transforms:
  - type: demand_multiplier
    from_year: 2038
    factor: 1.15
    applies_to: [base_total, critical]

  - type: isru_actual_supply
    # фактические доли поставки ISRU от номинальной мощности по годам
    # (заданы кейсом; в блоке рисков НЕ умножаются повторно на reliability)
    shares:
      2038: 0.78
      2039: 0.90
      2040: 0.93

discounting:
  real_rate: 0.07
  moment: end_of_year
  base_year: 2035
