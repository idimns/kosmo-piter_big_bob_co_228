# Стандартный сценарий - базовые данные кейса без изменений.
# Контрольный расчёт. Числовые параметры набора сохраняются.
id: standard
name: Стандартный сценарий
description: >
  Базовый спрос, поставки по плану без случайных отказов.
  Требования 99% критического и 97% общего спроса обязательны.

demand_variant: base        # base | low | high
transforms: []              # без трансформаций

# момент дисконтирования и ставка - допущение команды (assumption)
discounting:
  real_rate: 0.07           # assumption: реальная ставка 7%, см. docs/sources.md
  moment: end_of_year       # дисконтируем на конец года
  base_year: 2035
